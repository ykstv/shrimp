<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>shrimp_and_the_rest</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 100vw; height: 100vh; overflow: hidden; background: #f0f4f8;
      display: flex; align-items: center; justify-content: center;
    }
    svg { display: block; touch-action: none; }
  </style>
</head>
<body>
<script type="module">
  import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";
  import { feature } from "https://cdn.jsdelivr.net/npm/topojson-client@3/+esm";

  const HIGHLIGHTED_IDS = new Set([
    804,  // Ukraine
    826,  // United Kingdom
    840,  // United States
    380,  // Italy
    642,  // Romania
    36,   // Australia
  ]);

  // Crimea polygon extracted directly from world-atlas 50m data
  // (polygon 98 of Russia's MultiPolygon geometry in that dataset)
  const crimeaFeature = {
    type: "Feature",
    geometry: {
      type: "Polygon",
      coordinates: [[
        [33.5937,46.0967],[33.6549,46.1471],[33.6585,46.22],[33.8061,46.2078],
        [34.0257,46.1071],[34.1265,46.0898],[34.2237,46.1019],[34.3533,46.062],
        [34.4505,45.9665],[34.5225,45.9769],[34.6881,45.9769],[34.7925,45.8919],
        [34.7997,45.7912],[34.9473,45.7287],[35.023,45.7009],[35.2606,45.4475],
        [35.3722,45.3537],[35.4586,45.3155],[35.5594,45.3103],[35.7502,45.3902],
        [35.833,45.4023],[36.013,45.3711],[36.0778,45.4249],[36.1714,45.4527],
        [36.2902,45.4561],[36.427,45.4336],[36.5746,45.3936],[36.5134,45.3034],
        [36.4522,45.2322],[36.427,45.1541],[36.3946,45.0655],[36.229,45.0256],
        [36.0562,45.0308],[35.869,45.0048],[35.8042,45.0395],[35.761,45.0707],
        [35.6782,45.102],[35.5702,45.1194],[35.473,45.0985],[35.3578,44.9787],
        [35.1562,44.8971],[35.0878,44.8034],[34.8861,44.8242],[34.7169,44.8069],
        [34.4685,44.7218],[34.2813,44.5378],[34.0761,44.4232],[33.9105,44.3868],
        [33.7557,44.3989],[33.6549,44.4336],[33.4497,44.5534],[33.4641,44.5968],
        [33.4929,44.6194],[33.5289,44.6801],[33.6117,44.9076],[33.6009,44.9822],
        [33.5541,45.0968],[33.3921,45.1871],[33.2625,45.1714],[33.1869,45.194],
        [32.9169,45.3485],[32.7729,45.3589],[32.6109,45.3277],[32.5533,45.3502],
        [32.5065,45.4041],[32.8269,45.5933],[33.1437,45.7495],[33.2805,45.7652],
        [33.4677,45.8381],[33.6657,45.9474],[33.6369,46.0325],[33.5937,46.0967],
      ]],
    },
  };

  const COLOR_PRIMARY   = "#c85f33";  // Ukraine, UK, USA, Italy
  const COLOR_SECONDARY = "#d9985d";  // Romania, Australia
  const SECONDARY_IDS   = new Set([642, 36]);

  function countryColor(id) {
    return SECONDARY_IDS.has(+id) ? COLOR_SECONDARY : COLOR_PRIMARY;
  }

  const width  = window.innerWidth;
  const height = window.innerHeight;
  const radius = Math.min(width, height) * 0.45;

  const projection = d3.geoOrthographic()
    .scale(radius)
    .translate([width / 2, height / 2])
    .rotate([-32, -49])
    .clipAngle(90);

  const path = d3.geoPath().projection(projection);

  const svg = d3.select("body").append("svg")
    .attr("width", width)
    .attr("height", height);

  // SVG filter: blur only — applied to a glow layer beneath the crisp fill
  const defs = svg.append("defs");
  const filter = defs.append("filter")
    .attr("id", "glow")
    .attr("x", "-30%").attr("y", "-30%")
    .attr("width", "160%").attr("height", "160%");
  filter.append("feGaussianBlur")
    .attr("in", "SourceGraphic")
    .attr("stdDeviation", "3");

  // Clip path: restricts the background image to the globe circle
  defs.append("clipPath")
    .attr("id", "globe-clip")
    .append("circle")
      .attr("cx", width / 2).attr("cy", height / 2).attr("r", radius);

  // Background image clipped to globe circle (sits behind land layers)
  svg.append("image")
    .attr("href", "shrimp_circle.png")
    .attr("x", width / 2 - radius).attr("y", height / 2 - radius)
    .attr("width", radius * 2).attr("height", radius * 2)
    .attr("clip-path", "url(#globe-clip)");

  // Globe outline
  svg.append("circle")
    .attr("cx", width / 2).attr("cy", height / 2).attr("r", radius)
    .attr("fill", "none")
    .attr("stroke", "#b0bec5")
    .attr("stroke-width", 1);

  // Plain countries (white)
  const plainGroup = svg.append("g");

  // Glow layer: blurred copy of highlighted countries, drawn beneath sharp fill
  const glowGroup = svg.append("g").attr("filter", "url(#glow)");

  // Sharp fill layer: crisp highlighted countries on top
  const neonGroup = svg.append("g");

  const world = await d3.json(
    "https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json"
  );

  const countries = feature(world, world.objects.countries);

  const plainFeatures      = countries.features.filter(d => !HIGHLIGHTED_IDS.has(+d.id));
  const highlightedFeatures = countries.features.filter(d =>  HIGHLIGHTED_IDS.has(+d.id));

  plainGroup.selectAll("path")
    .data(plainFeatures)
    .join("path")
    .attr("d", path)
    .attr("fill", "#ffffff")
    .attr("stroke", "#90a4ae")
    .attr("stroke-width", 0.4);

  // Glow layer (blurred, no stroke needed)
  glowGroup.selectAll("path.country")
    .data(highlightedFeatures)
    .join("path")
    .classed("country", true)
    .attr("d", path)
    .attr("fill", d => countryColor(d.id))
    .attr("stroke", "none");

  glowGroup.append("path")
    .datum(crimeaFeature)
    .attr("d", path)
    .attr("fill", COLOR_PRIMARY)
    .attr("stroke", "none");

  // Sharp fill layer on top
  neonGroup.selectAll("path.country")
    .data(highlightedFeatures)
    .join("path")
    .classed("country", true)
    .attr("d", path)
    .attr("fill", d => countryColor(d.id))
    .attr("stroke", "#ffffff")
    .attr("stroke-width", 0.5);

  // Crimea overlay — always rendered as Ukraine regardless of source data
  neonGroup.append("path")
    .datum(crimeaFeature)
    .attr("d", path)
    .attr("fill", COLOR_PRIMARY)
    .attr("stroke", "#ffffff")
    .attr("stroke-width", 0.5);

  function redraw() {
    plainGroup.selectAll("path").attr("d", path);
    glowGroup.selectAll("path").attr("d", path);
    neonGroup.selectAll("path").attr("d", path);
  }

  // Drag: translate pixel delta directly into rotation degrees.
  // In D3 geoOrthographic, rotate([lambda, phi]):
  //   +lambda shifts center westward → visible content moves RIGHT
  //   -phi    shifts center northward → visible content moves DOWN
  // So to make the globe surface follow the cursor:
  //   drag right (dx>0) → +lambda, drag down (dy>0) → -phi
  const sens = 90 / radius; // degrees per pixel
  let x0, y0, r0;

  svg.call(
    d3.drag()
      .on("start", event => {
        x0 = event.x;
        y0 = event.y;
        r0 = projection.rotate();
      })
      .on("drag", event => {
        projection.rotate([
          r0[0] + (event.x - x0) * sens,
          Math.max(-90, Math.min(90, r0[1] - (event.y - y0) * sens)),
        ]);
        redraw();
      })
  );

  svg.on("wheel.zoom", null);
</script>
</body>
</html>
